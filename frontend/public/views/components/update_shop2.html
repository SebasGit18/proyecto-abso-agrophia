<div class="shop-update__content">
    <!-- <a href="/frontend/public/views/p_update_shop.html" class="shop-update__back">Volver</a> -->

    <!-- <h1 class="form-shop__title">Agrophia</h1> -->

    <div class="shop-update__container">

        <div class="shop">
                <h2 class="shop-update__subtitle">Editar Tienda</h2>
            <div class="shop-update">
                <form class="shop-update__body">

                    <div class="shop-update__group">
                        <label for="horario" class="shop-update__label">Horario de atención</label>
                        <input type="text" class="shop-update__input" placeholder="Ej:Lunes a viernes 8AM a 6PM" required>
                    </div>

                    <div class="shop-update__group">
                        <label for="url" class="shop-update__label">URL de tu sitio web (opcional)</label>
                        <input type="url" class="shop-update__input" placeholder="www.el ahorro.com.co" required>
                    </div>

                </form>
                
                <div class="shop-update__textarea">
                    <label for="message" class="shop-update__label">Descripcion breve de la tienda (opcional)</label>
                    <textarea type="message" class="shop-update__description" placeholder="Descripcion breve de la tienda"></textarea>
                </div>

                <div class="profile-update__row-buttons">
                    <a href=/frontend/public/views/p_update_shop.html class="profile-update__row-buttons__back">Volver</a>
                    <a href="/frontend/public/views/profile_shop.html" onclick="mostrarAlerta(event)" class="profile-update__row-buttons__next">
                        Editar Tienda
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
